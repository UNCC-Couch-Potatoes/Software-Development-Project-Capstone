# Only a trusted HTTPS proxy/ALB may reach this server in production.
map $http_x_forwarded_proto $original_scheme {
    default $scheme;
    https https;
    http http;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    location /api/ {
        # Resolve again after a backend container is recreated.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend backend:8080;
        proxy_pass http://$api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $original_scheme;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
