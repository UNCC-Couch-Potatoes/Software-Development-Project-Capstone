# Explicit property names preserve the Connector/J property casing.
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=file:/run/rds/truststore.p12
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=PKCS12
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${RDS_TRUSTSTORE_PASSWORD}
